runtime: go126
instance_class: F2
app_engine_apis: true

env_variables:
  BUCKET_NAME: gopherizeme.appspot.com
  GOMEMLIMIT: 350MiB

automatic_scaling:
  max_concurrent_requests: 10

handlers:
- url: /favicon\.ico
  static_files: static/favicon.ico
  upload: static/favicon\.ico
- url: /favicon
  static_files: static/favicon.ico
  upload: static/favicon\.ico
- url: /static
  static_dir: static
- url: /.*
  script: auto
